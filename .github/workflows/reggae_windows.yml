# Reggae Slicer: compila só o Windows x64 a cada push no ramo `reggae`.
# Reaproveita os workflows do OrcaSlicer (dependências em cache + aplicativo).
# O resultado fica nos artefatos da execução: OrcaSlicer_Windows_<versão>_portable.
name: Reggae Slicer - Windows

on:
  push:
    branches:
      - reggae
  workflow_dispatch:

concurrency:
  group: reggae-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Confere o contraste das cores antes de gastar ~45 min compilando; a página fica nos artefatos.
  cores:
    name: Mostruário de cores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/reggae/mostruario.py --verificar --saida mostruario-cores.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mostruario-cores
          path: mostruario-cores.html

  build_windows:
    name: Build Windows x64
    needs: cores
    permissions:
      actions: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
    secrets: inherit
